[project]
name = "aisle"
version = "0.1.0"
description = "AISLE: agentic auto-research for robot manipulation on open infrastructure"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.83.1",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pillow>=11.3.0",
    "protobuf>=7.36.1",
    "pyarrow>=17.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
harness = "aisle.harness.cli:main"

# CON-1: linux resolves torch from the CPU index by default so the sim
# extra never drags CUDA/NVIDIA wheels; the `cuda` extra is the sanctioned
# home for GPU builds and is the ONLY way a CUDA wheel enters the closure
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# sim and cuda are mutually exclusive resolutions of torch: `--extra sim`
# is the CPU default, `--extra cuda` swaps in the GPU build
[tool.uv]
conflicts = [[{ extra = "sim" }, { extra = "cuda" }], [{ extra = "vla" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "sim", marker = "sys_platform == 'linux'" },
    # vla (lerobot) inference is CPU/MPS at bring-up (ADR-38): same CPU
    # routing as sim so CON-1's no-CUDA-outside-the-cuda-extra gate holds
    { index = "pytorch-cpu", extra = "vla", marker = "sys_platform == 'linux'" },
]

[project.optional-dependencies]
sim = [
    "dora-rs==1.0.1",
    "genesis-world>=1.2.3",
    "pyarrow>=25.0.0",
    "torch>=2.13.0",
    # realistic verifier (VER-5, ADR-realistic-verifier D1): OWLv2 via
    # transformers, CPU inference only (D2) — CON-1: no CUDA-only pulls
    "transformers>=4.57.0",
    # optional engines (ADR-67, ADR-68, ADR-70): the published Nexus wheel and
    # rapier, which renders through it. Limited to the platforms
    # dimforge-nexus3d ships wheels for.
    "dimforge-nexus3d==0.2.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "rapier3d==0.36.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# GPU build: the sim stack without the optional engines (no published Nexus
# wheel has CUDA, ADR-70), torch resolved from the CUDA index (CON-1).
# `uv sync --extra cuda` replaces `uv sync --extra sim`.
cuda = [
    "dora-rs==1.0.1",
    "genesis-world>=1.2.3",
    "pyarrow>=25.0.0",
    "torch>=2.13.0",
    "transformers>=4.57.0",
]
vla = [
    "lerobot>=0.2",
    "num2words>=0.5.14",
    "peft>=0.20.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: no sim, no dora, <1 s each (CON-12)",
    "sim: imports genesis; headless (CON-12)",
    "graph: launches a dora dataflow (CON-12)",
    "accept: spec-acceptance; cites requirement IDs (CON-12)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
